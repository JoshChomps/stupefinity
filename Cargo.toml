[workspace]
resolver = "2"
members = [
    "crates/stupefinity-protocol",
    "crates/stupefinity-core",
    "crates/stupefinity-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Josh"]
license = "MIT"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
# Enough for backtraces with line numbers; full debug info made target/ about 20 GB.
debug = "line-tables-only"

# Dependencies need no debug info, and run fast enough to play audio in debug builds.
[profile.dev.package."*"]
debug = false
opt-level = 1
